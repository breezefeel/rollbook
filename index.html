<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>출석 체크</title>
  <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      body {
          font-family: -apple-system, 'Malgun Gothic', sans-serif;
          background: linear-gradient(135deg, #FFF1F2 0%, #FFE4E6 100%);
          min-height: 100vh;
          display: flex; justify-content: center; align-items: center; padding: 10px;
      }
      .container {
          max-width: 600px; width: 100%; background: white;
          border-radius: 40px; padding: 80px 40px; text-align: center;
          box-shadow: 0 30px 60px rgba(251, 113, 133, 0.3);
      }
      h1 { color: #9D174D; margin-bottom: 20px; font-size: 48px; font-weight: 900; }
      p { color: #BE185D; margin-bottom: 50px; font-size: 24px; font-weight: 600; opacity: 0.9; }
      
      input[type="text"] {
          width: 100%; padding: 35px; border: 4px solid #FECDD3;
          border-radius: 25px; font-size: 40px; margin-bottom: 30px; 
          text-align: center; outline: none; transition: 0.3s;
          background-color: #FFF9FA; color: #1e293b;
      }
      input[type="text"]:focus { border-color: #FB7185; background-color: #ffffff; transform: scale(1.02); }
      
      .btn-submit {
          width: 100%; padding: 35px; background: #FB7185; color: white;
          border: none; border-radius: 25px; font-size: 36px; font-weight: 800;
          cursor: pointer; transition: 0.3s; box-shadow: 0 12px 20px rgba(251, 113, 133, 0.4);
      }
      .btn-submit:hover { background: #F43F5E; transform: translateY(-5px); }
      
      #resultMessage {
          margin-top: 40px; padding: 30px; border-radius: 25px; display: none;
          line-height: 1.6; font-size: 24px; font-weight: 700;
      }
      .status-normal { background: #FFF1F2; color: #9D174D; border: 3px solid #FB7185; }
      .time-info { display: block; margin-top: 15px; font-size: 20px; color: #BE185D; font-weight: 400; }
  </style>
</head>
<body>
  <div class="container">
    <h1>🌸 출석 체크</h1>
    <p>성함을 입력하고 버튼을 눌러주세요</p>
    
    <input type="text" id="userName" 
           placeholder="이름 입력" 
           lang="ko" 
           spellcheck="false" 
           autocomplete="off" 
           autofocus>
           
    <button class="btn-submit" id="attendBtn">출석 완료</button>

    <div id="resultMessage"></div>
  </div>

  <script>
    const scriptUrl = 'https://script.google.com/macros/s/AKfycbweNqZrvKYvJ2R2u34TK6oFcVbcN909A3mq3rkyCKjzjiEEf6LIaVn-3GyVlnw4DCAYaQ/exec';

    document.getElementById('attendBtn').addEventListener('click', async () => {
      const name = document.getElementById('userName').value.trim();
      const resultDiv = document.getElementById('resultMessage');
      
      if (!name) { alert('성함을 입력해 주세요!'); return; }

      resultDiv.style.display = 'block';
      resultDiv.className = 'status-normal';
      resultDiv.innerText = '⏳ 출석을 기록하고 있습니다...';

      const now = new Date();
      const timeStr = `${now.getFullYear()}-${now.getMonth()+1}-${now.getDate()} ${now.getHours()}:${String(now.getMinutes()).padStart(2, '0')}`;

      try {
        await fetch(scriptUrl, {
          method: 'POST',
          mode: 'no-cors',
          body: JSON.stringify({ name: name })
        });

        resultDiv.innerHTML = `
          ✅ <strong>${name}</strong>님, 출석 완료!<br>
          좋은 하루 보내세요!<br>
          <span class="time-info">🕒 일시: ${timeStr}</span>
        `;
        document.getElementById('userName').value = '';
        
      } catch (e) {
        resultDiv.innerText = '❌ 통신 장애가 발생했습니다.';
      }
    });
  </script>
</body>
</html>
